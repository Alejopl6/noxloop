[package]
name = "noxloop-desktop"
version = "0.1.0"
description = "La ventana de escritorio de noxloop: empaqueta la interfaz estatica y levanta el servicio de control como sidecar."
edition = "2021"
rust-version = "1.82"
publish = false
# Hay dos binarios —la app y `noxloop-llavero`— y `tauri dev` corre `cargo run`
# sin `--bin`: sin esta linea no sabe cual arrancar y `tauri dev` no arrancaba.
default-run = "noxloop-desktop"

# El binario es una cascara de tres lineas y toda la logica vive en la
# biblioteca. No es estetica: `cargo test` no puede enlazar contra un crate
# que solo expone `main`, asi que sin este `[lib]` las pruebas de T035 no
# tendrian nada a lo que llamar.
[lib]
name = "noxloop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
getrandom = "0.3"
serde_json = "1"

# El llavero del sistema operativo (T130). Va por target porque cada plataforma
# tiene su almacen y su backend nativo: Keychain, Credential Manager y Secret
# Service. La version 3 y no la 4 porque la 4 exige Rust 1.88 y este paquete
# declara 1.82; subir el minimo del proyecto por una dependencia es una decision
# aparte de esta.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `sync-secret-service` y no la variante asincrona: este binario hace una
# operacion y termina, asi que un runtime asincrono entero solo agrega superficie.
keyring = { version = "3", features = ["sync-secret-service"] }
