name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # git es una dependencia del motor: la cola de integracion y los
      # worktrees se prueban contra repositorios reales, no simulados.
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate
